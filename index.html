
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10151c">
  <title>Damas 2 Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="loading">
      <h1>DAMAS 2</h1>
      <p>3D SIMULATOR</p>
      <div class="loader"></div>
      <span>3D muhit yuklanmoqda...</span>
    </div>

    <div id="scene"></div>

    <div id="dashboard">
      <div class="topbar">
        <strong>DAMAS 2 SIMULATOR</strong>
        <span id="speed">0 KM/H</span>
      </div>

      <div class="camera-buttons">
        <button id="interiorBtn">SALON</button>
        <button id="exteriorBtn">TASHQI</button>
      </div>

      <div class="controls">
        <button id="leftBtn">◀</button>
        <button id="rightBtn">▶</button>
        <button id="brakeBtn">TORMOZ</button>
        <button id="gasBtn">GAZ</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
